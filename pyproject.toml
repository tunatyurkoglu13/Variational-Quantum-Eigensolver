[project]
name = "vqe-nisq-project"
version = "0.1.0"
description = "Comparative study of VQE ansatze and error mitigation strategies on NISQ-era quantum hardware"
authors = [
    { name = "Tuna Tyurkoglu", email = "tuna.tyurkoglu@tum.de" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.16.0",
    "hydra-core>=1.3.6",
    "matplotlib>=3.11.1",
    "mitiq>=1.1.0",
    "mlflow>=3.16.0",
    "mthree>=3.0.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "openfermion>=1.8.1",
    "pandas>=2.3.3",
    "pennylane>=0.45.1",
    "pennylane-lightning>=0.45.0",
    "pennylane-qiskit>=0.45.0",
    "plotly>=7.0.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyscf>=2.14.0",
    "python-dotenv>=1.2.3",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
    "qiskit-algorithms>=0.4.0",
    "qiskit-ibm-runtime>=0.45.1",
    "qiskit-nature>=0.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N"]
ignore = [
    "N803", # argument name should be lowercase -- physics code uses H, U, N_qubits etc.
    "N806", # variable name should be lowercase -- same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

# Third-party quantum/chemistry libraries ship no inline types or stubs.
[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_nature.*",
    "qiskit_algorithms.*",
    "qiskit_ibm_runtime.*",
    "pyscf.*",
    "mitiq.*",
    "mthree.*",
    "hydra.*",
    "scipy.*",
]
ignore_missing_imports = true

# openfermion and pennylane ship partial/inconsistent inline type hints, which
# (unlike a fully-untyped package) makes mypy strict-mode's no-untyped-call and
# no-implicit-reexport checks fire on calls *into* them instead of being
# silently skipped. (These per-module overrides configure checking of code
# *inside* the named modules, not calls into them from our own code -- calls
# to their untyped decorators like `@qml.qnode` still need a targeted
# `# type: ignore[untyped-decorator]` at each call site.)
[[tool.mypy.overrides]]
module = ["openfermion.*", "pennylane.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vqe_nisq_project --cov-report=term-missing"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
